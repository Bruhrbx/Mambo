<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mambo - Internet without interruptions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Font kustom yang mirip dengan gaya desain modern/minimalis */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#1F1E2E] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <nav class="flex justify-between items-center px-8 py-6 max-w-7xl mx-auto w-full">
        <div class="flex items-center gap-2.5 font-medium text-xl tracking-wide">
            <img src="https://raw.githubusercontent.com/Bruhrbx/Mambo/refs/heads/main/icon.png" alt="Mambo Logo" class="w-6 h-6 object-contain">
            <span>Mambo</span>
        </div>

        <div class="flex items-center gap-8 text-sm font-medium opacity-90">
            <a href="https://github.com/Bruhrbx/Mambo" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 hover:opacity-100 transition">
                GitHub
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
            </a>
            <a href="https://github.com/Bruhrbx/Mambo/releases/tag/Stable" target="_blank" rel="noopener noreferrer" class="bg-white text-[#1F1E2E] px-4 py-2 rounded-full font-semibold flex items-center gap-2 hover:bg-opacity-90 transition shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V15"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download
            </a>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center text-center px-4 pt-16 pb-12 max-w-3xl mx-auto w-full">
        <div class="mb-6 opacity-95">
            <img src="https://raw.githubusercontent.com/Bruhrbx/Mambo/refs/heads/main/icon.png" alt="Mambo Large Logo" class="w-16 h-16 object-contain">
        </div>

        <h1 class="text-4xl md:text-5xl font-semibold tracking-tight mb-6">
            Internet without interruptions
        </h1>

        <p class="text-lg opacity-85 leading-relaxed font-light mb-8 max-w-2xl">
            Best-in-class privacy and unbiased ad blocking by default. <br class="hidden md:inline">
            No adware, no distractions. Completely open source. <br class="hidden md:inline">
            Made for people, by people. Fully open source.<br class="hidden md:inline">
        </p>

        <div class="flex flex-col items-center gap-3">
            <a href="https://github.com/Bruhrbx/Mambo/releases/tag/Stable" target="_blank" rel="noopener noreferrer" class="bg-white text-[#1F1E2E] px-6 py-3 rounded-md font-medium text-base flex items-center gap-2 hover:bg-opacity-95 transition shadow-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V15"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Mambo
        <div class="flex flex-col items-center gap-3">
            <a href="https://github.com/Bruhrbx/Mambo/releases/tag/Unstable" target="_blank" rel="noopener noreferrer" class="bg-white text-[#1F1E2E] px-6 py-3 rounded-md font-medium text-base flex items-center gap-2 hover:bg-opacity-95 transition shadow-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V15"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Unstable
            </a>
            <span class="text-xs bg-black bg-opacity-30 text-purple-200 px-3 py-1 rounded-full uppercase tracking-wider font-semibold">
                <span class="opacity-60 text-[10px]">For Windows 10+ (64-bit)
            </span>
        </div>
    </main>

</html>
